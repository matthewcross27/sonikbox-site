<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SonikBox — direction preview (temporary)</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #08080a;
    color: #9ca3af;
    font-family: "IBM Plex Mono", Consolas, monospace;
    display: flex;
    flex-direction: column;
  }
  .bar {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 20px;
    padding: 10px 16px;
    background: #1b1206;
    border-bottom: 2px solid #ff5500;
  }
  .stamp {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #ff5500;
  }
  .stamp::before {
    content: "";
    width: 8px;
    height: 8px;
    background: #ff5500;
  }
  .note { font-size: 11px; letter-spacing: 0.04em; color: #7c7a80; }
  .options { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
  .opt {
    appearance: none;
    display: inline-flex;
    flex-direction: column;
    gap: 2px;
    min-height: 44px;
    padding: 6px 14px;
    background: transparent;
    border: 1px solid #3a3229;
    border-radius: 0;
    color: #9ca3af;
    font: inherit;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: left;
    cursor: pointer;
  }
  .opt b { color: #e8e6e2; font-weight: 600; letter-spacing: 0.12em; }
  .opt span { font-size: 10px; letter-spacing: 0.04em; text-transform: none; color: #6f6d73; }
  .opt:hover { border-color: #b33c00; }
  .opt[aria-pressed="true"] { border-color: #ff5500; box-shadow: inset 0 0 0 1px #ff5500; }
  .opt[aria-pressed="true"] b { color: #ff5500; }
  .opt:focus-visible { outline: 2px solid #ff5500; outline-offset: 2px; }
  .kbd { font-size: 10px; color: #55535a; letter-spacing: 0.06em; }
  iframe { flex: 1 1 auto; width: 100%; border: 0; display: block; background: #08080a; }
  @media (max-width: 700px) {
    .options { margin-left: 0; width: 100%; }
    .opt { flex: 1 1 auto; }
  }
</style>
</head>
<body>

<div class="bar">
  <span class="stamp">Temporary preview</span>
  <span class="note">Not part of the site. Delete <code>preview/</code> to remove it.</span>
  <div class="options" id="options" role="group" aria-label="Visual direction"></div>
  <span class="kbd">keys 0-4</span>
</div>

<iframe id="stage" title="SonikBox site preview" src="../index.html"></iframe>

<script>
(function () {
  "use strict";

  var DIRECTIONS = [
    { key: "default", label: "Default", blurb: "as it ships today" },
    { key: "signal", label: "A / Signal", blurb: "orange as ground, not accent" },
    { key: "1u", label: "B / 1U", blurb: "machined rack, orange as indicator only" },
    { key: "rider", label: "C / Rider", blurb: "the printed rider, on screen" },
    { key: "rider-black", label: "D / Rider on black", blurb: "C's feel, black base, orange blocks" }
  ];

  var stage = document.getElementById("stage");
  var options = document.getElementById("options");
  var current = fromHash();

  function fromHash() {
    var want = (location.hash || "").replace("#", "");
    for (var i = 0; i < DIRECTIONS.length; i++) {
      if (DIRECTIONS[i].key === want) { return want; }
    }
    return "default";
  }

  // Same-origin, so the direction sheet is appended straight into the framed
  // document. The site's own files are never touched.
  function apply() {
    var doc = stage.contentDocument;
    // Before the framed document commits, contentDocument is the initial
    // about:blank, which inherits THIS page's base URL. Injecting there both
    // resolves the sheet against /preview/ (a 404) and gets thrown away a
    // moment later, so wait for the real document.
    if (!doc || !doc.head || doc.URL === "about:blank") { return; }
    var link = doc.getElementById("preview-direction");
    if (current === "default") {
      if (link) { link.remove(); }
    } else {
      if (!link) {
        link = doc.createElement("link");
        link.id = "preview-direction";
        link.rel = "stylesheet";
        doc.head.appendChild(link);
      }
      // Resolved against this page rather than the framed one, so it is correct
      // wherever the directory is mounted. Cache-busted because these sheets
      // are edited live while the captain watches.
      link.setAttribute("href", new URL("direction-" + current + ".css?t=" + Date.now(), location.href).href);
    }
    [].forEach.call(options.children, function (btn) {
      btn.setAttribute("aria-pressed", String(btn.dataset.key === current));
    });
  }

  DIRECTIONS.forEach(function (d, i) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "opt";
    btn.dataset.key = d.key;
    btn.innerHTML = "<b>" + i + " &nbsp;" + d.label + "</b><span>" + d.blurb + "</span>";
    btn.addEventListener("click", function () {
      current = d.key;
      history.replaceState(null, "", "#" + d.key);
      apply();
    });
    options.appendChild(btn);
  });

  stage.addEventListener("load", apply);
  window.addEventListener("hashchange", function () { current = fromHash(); apply(); });
  document.addEventListener("keydown", function (e) {
    var i = "01234".indexOf(e.key);
    if (i >= 0 && !e.metaKey && !e.ctrlKey && !e.altKey) {
      current = DIRECTIONS[i].key;
      history.replaceState(null, "", "#" + current);
      apply();
    }
  });
  apply();
})();
</script>
</body>
</html>
